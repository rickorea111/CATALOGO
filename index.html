<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATÁLOGO DE TÊNIS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; color: #111; }
header { background: #111; color: #fff; padding: 28px 20px; text-align: center; }
header h1 { font-size: 32px; letter-spacing: 2px; }
header p { margin-top: 8px; color: #bbb; }
.container { max-width: 1200px; margin: auto; padding: 25px 18px; }
.search { width: 100%; padding: 16px 20px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; margin-bottom: 20px; }
.search:focus { border-color: #111; }
.brands { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
.brand-btn { border: 1px solid #ddd; background: #fff; padding: 12px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: bold; transition: .2s; }
.brand-btn:hover, .brand-btn.active { background: #111; color: #fff; }
.products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.product { background: #fff; border-radius: 16px; overflow: hidden; cursor: pointer; transition: .25s; border: 1px solid #eee; }
.product:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,.10); }
.product-image { height: 240px; background: linear-gradient(135deg, #eee, #d7d7d7); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.product-image img, .product-image video { width: 100%; height: 100%; object-fit: cover; }
.shoe-placeholder { font-size: 70px; }
.brand-tag { position: absolute; top: 12px; left: 12px; background: #111; color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 2; }
.add-media { position: absolute; bottom: 10px; right: 10px; background: #fff; border: 1px solid #ccc; border-radius: 20px; padding: 7px 12px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 2; }
.add-media:hover { background: #111; color: #fff; }
.product-info { padding: 17px; }
.product-brand { color: #777; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }
.product-name { font-size: 18px; font-weight: bold; }
.product-category { color: #777; margin-top: 7px; font-size: 13px; }
.product-price { font-size: 19px; font-weight: bold; margin-top: 15px; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 999; padding: 20px; overflow-y: auto; }
.modal-box { background: #fff; max-width: 850px; margin: 30px auto; border-radius: 20px; overflow: hidden; position: relative; }
.close { position: absolute; right: 18px; top: 14px; width: 40px; height: 40px; border: none; border-radius: 50%; background: #111; color: #fff; font-size: 22px; cursor: pointer; z-index: 5; }
.modal-content { display: grid; grid-template-columns: 1fr 1fr; }
.modal-image { min-height: 430px; background: linear-gradient(135deg, #eee, #d7d7d7); display: flex; align-items: center; justify-content: center; font-size: 120px; }
.modal-image img, .modal-image video { width: 100%; height: 100%; max-height: 520px; object-fit: contain; }
.modal-info { padding: 45px 35px; }
.modal-brand { color: #777; text-transform: uppercase; font-size: 13px; margin-bottom: 10px; }
.modal-title { font-size: 34px; margin-bottom: 15px; }
.modal-category { color: #666; margin-bottom: 25px; }
.modal-price { font-size: 28px; font-weight: bold; margin-bottom: 25px; }
.info-box { background: #f5f5f5; padding: 15px; border-radius: 12px; margin-top: 15px; }
.info-box strong { display: block; margin-bottom: 6px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.btn { border: 1px solid #111; background: #111; color: #fff; padding: 12px 18px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; }
.btn.light { background: #fff; color: #111; }
footer { text-align: center; padding: 40px 20px; color: #777; }
.no-results { text-align: center; padding: 50px; color: #777; display: none; }
@media (max-width: 900px) { .products { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 650px) {
  header h1 { font-size: 24px; }
  .products { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .product-image { height: 180px; }
  .shoe-placeholder { font-size: 55px; }
  .modal-content { grid-template-columns: 1fr; }
  .modal-image { min-height: 280px; }
  .modal-info { padding: 30px 22px; }
  .modal-title { font-size: 27px; }
}
@media (max-width: 400px) { .products { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>CATÁLOGO DE TÊNIS</h1>
  <p>Encontre seu próximo tênis</p>
</header>

<main class="container">
  <input type="text" id="search" class="search" placeholder="🔎 Pesquisar modelo ou marca...">
  <div class="brands">
    <button class="brand-btn active" onclick="filterBrand('Todos', this)">Todos</button>
    <button class="brand-btn" onclick="filterBrand('Adidas', this)">Adidas</button>
    <button class="brand-btn" onclick="filterBrand('ASICS', this)">ASICS</button>
    <button class="brand-btn" onclick="filterBrand('Nike', this)">Nike</button>
    <button class="brand-btn" onclick="filterBrand('New Balance', this)">New Balance</button>
  </div>
  <div id="products" class="products"></div>
  <div id="noResults" class="no-results">Nenhum tênis encontrado.</div>
</main>

<div id="modal" class="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div class="modal-content">
      <div id="modalImage" class="modal-image">👟</div>
      <div class="modal-info">
        <div id="modalBrand" class="modal-brand"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalCategory" class="modal-category"></div>
        <div id="modalPrice" class="modal-price"></div>
        <div class="info-box"><strong>Modelo</strong><span id="modalModel"></span></div>
        <div class="info-box"><strong>Disponibilidade</strong>Consulte a disponibilidade.</div>
        <div class="modal-actions">
          <button class="btn" onclick="pickFile(currentProduct.id)">📷 Escolher foto ou vídeo</button>
          <button class="btn light" onclick="removeMedia(currentProduct.id)">Remover</button>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="filePicker" accept="image/*,video/mp4,video/*" style="display:none">

<footer>CATÁLOGO DE TÊNIS</footer>

<script>
const products = [
  { id: "adidas-adizero-evo-sl", brand: "Adidas", name: "Adizero EVO SL", category: "Running", price: "R$ 1.099,99" },
  { id: "adidas-adizero-sl-2", brand: "Adidas", name: "Adizero SL 2", category: "Running", price: "R$ 799,99" },
  { id: "adidas-ultraboost", brand: "Adidas", name: "Ultraboost", category: "Running", price: "Consultar" },
  { id: "adidas-supernova", brand: "Adidas", name: "Supernova", category: "Running", price: "Consultar" },
  { id: "asics-novablast", brand: "ASICS", name: "Novablast", category: "Running", price: "Consultar" },
  { id: "asics-gel-nimbus", brand: "ASICS", name: "Gel-Nimbus", category: "Running", price: "Consultar" },
  { id: "asics-gel-kayano", brand: "ASICS", name: "Gel-Kayano", category: "Running", price: "Consultar" },
  { id: "asics-gel-cumulus", brand: "ASICS", name: "Gel-Cumulus", category: "Running", price: "Consultar" },
  { id: "nike-pegasus", brand: "Nike", name: "Pegasus", category: "Running", price: "Consultar" },
  { id: "nike-vomero", brand: "Nike", name: "Vomero", category: "Running", price: "Consultar" },
  { id: "nike-structure", brand: "Nike", name: "Structure", category: "Running", price: "Consultar" },
  { id: "nike-air-max", brand: "Nike", name: "Air Max", category: "Lifestyle", price: "Consultar" },
  { id: "nb-fresh-foam-1080", brand: "New Balance", name: "Fresh Foam 1080", category: "Running", price: "Consultar" },
  { id: "nb-fresh-foam-880", brand: "New Balance", name: "Fresh Foam 880", category: "Running", price: "Consultar" },
  { id: "nb-9060", brand: "New Balance", name: "9060", category: "Lifestyle", price: "Consultar" },
  { id: "nb-574", brand: "New Balance", name: "574", category: "Lifestyle", price: "Consultar" }
];

let currentBrand = "Todos";
let currentProduct = null;
let pickingId = null;
const mediaCache = {};

let db = null;
function openDB() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open("catalogo-tenis", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("media");
      req.onsuccess = () => { db = req.result; resolve(); };
      req.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}
function dbSave(id, file) {
  return new Promise(resolve => {
    if (!db) return resolve();
    const tx = db.transaction("media", "readwrite");
    tx.objectStore("media").put(file, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}
function dbDelete(id) {
  return new Promise(resolve => {
    if (!db) return resolve();
    const tx = db.transaction("media", "readwrite");
    tx.objectStore("media").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}
function dbLoadAll() {
  return new Promise(resolve => {
    if (!db) return resolve();
    const tx = db.transaction("media", "readonly");
    const req = tx.objectStore("media").openCursor();
    req.onsuccess = () => {
      const cursor = req.result;
      if (cursor) { setMedia(cursor.key, cursor.value); cursor.continue(); }
      else resolve();
    };
    req.onerror = () => resolve();
  });
}

function setMedia(id, file) {
  if (mediaCache[id]) URL.revokeObjectURL(mediaCache[id].url);
  mediaCache[id] = {
    url: URL.createObjectURL(file),
    type: file.type.startsWith("video") ? "video" : "image"
  };
}

function pickFile(id) {
  pickingId = id;
  document.getElementById("filePicker").click();
}

document.getElementById("filePicker").addEventListener("change", async function () {
  const file = this.files[0];
  if (!file || !pickingId) return;
  setMedia(pickingId, file);
  await dbSave(pickingId, file);
  this.value = "";
  renderProducts();
  if (currentProduct && currentProduct.id === pickingId) openModal(currentProduct);
});

async function removeMedia(id) {
  if (mediaCache[id]) URL.revokeObjectURL(mediaCache[id].url);
  delete mediaCache[id];
  await dbDelete(id);
  renderProducts();
  if (currentProduct) openModal(currentProduct);
}

function mediaHTML(id, big) {
  const m = mediaCache[id];
  if (!m) return null;
  if (m.type === "video") {
    return big
      ? `<video src="${m.url}" controls playsinline></video>`
      : `<video src="${m.url}" muted loop playsinline autoplay></video>`;
  }
  return `<img src="${m.url}" alt="">`;
}

function renderProducts() {
  const container = document.getElementById("products");
  const noResults = document.getElementById("noResults");
  const search = document.getElementById("search").value.toLowerCase();
  container.innerHTML = "";

  const filtered = products.filter(p => {
    const okBrand = currentBrand === "Todos" || p.brand === currentBrand;
    const okSearch = p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search);
    return okBrand && okSearch;
  });

  if (filtered.length === 0) { noResults.style.display = "block"; return; }
  noResults.style.display = "none";

  filtered.forEach(product => {
    const card = document.createElement("div");
    card.className = "product";
    card.onclick = () => openModal(product);
    const media = mediaHTML(product.id, false) || `<span class="shoe-placeholder">👟</span>`;
    card.innerHTML = `
      <div class="product-image">
        <span class="brand-tag">${product.brand}</span>
        ${media}
        <button class="add-media" title="Escolher foto ou vídeo">📷</button>
      </div>
      <div class="product-info">
        <div class="product-brand">${product.brand}</div>
        <div class="product-name">${product.name}</div>
        <div class="product-category">${product.category}</div>
        <div class="product-price">${product.price}</div>
      </div>`;
    card.querySelector(".add-media").onclick = (e) => { e.stopPropagation(); pickFile(product.id); };
    container.appendChild(card);
  });
}

function filterBrand(brand, button) {
  currentBrand = brand;
  document.querySelectorAll(".brand-btn").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  renderProducts();
}

function openModal(product) {
  currentProduct = product;
  document.getElementById("modal").style.display = "block";
  document.getElementById("modalImage").innerHTML = mediaHTML(product.id, true) || "👟";
  document.getElementById("modalBrand").textContent = product.brand;
  document.getElementById("modalTitle").textContent = product.name;
  document.getElementById("modalCategory").textContent = product.category;
  document.getElementById("modalPrice").textContent = product.price;
  document.getElementById("modalModel").textContent = product.name;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("modalImage").innerHTML = "👟";
  currentProduct = null;
}

document.getElementById("search").addEventListener("input", renderProducts);
document.getElementById("modal").addEventListener("click", function (e) {
  if (e.target === this) closeModal();
});

(async function start() {
  await openDB();
  await dbLoadAll();
  renderProducts();
})();
</script>

</body>
</html>
